<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ZETA Wiki — Современная, быстрая и безопасная веб-энциклопедия нового поколения.">
    <meta name="theme-color" content="#090A0F">
    <title>ZETA Wiki — Современная Энциклопедия</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-dark">
    <!-- Reading Progress Bar -->
    <div id="reading-progress-bar" class="reading-progress-bar" aria-hidden="true"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
            <div class="sidebar-header">
                <a href="#home" class="logo" aria-label="На главную ZETA Wiki">
                    <div class="logo-icon">Z</div>
                    <span class="logo-text">ZETA<span>Wiki</span></span>
                </a>
                <button class="icon-btn sidebar-close-btn" id="sidebar-close-btn" aria-label="Закрыть меню">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <nav class="nav-menu" id="nav-menu">
                <div class="nav-section-label">Разделы</div>
                <a href="#home" class="nav-link active" data-nav="home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    <span>Главная</span>
                </a>
                <a href="#saved" class="nav-link" data-nav="saved">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                    </svg>
                    <span>Закладки</span>
                    <span class="nav-badge" id="bookmarks-count-badge">0</span>
                </a>
                <a href="#random" class="nav-link" data-nav="random" id="nav-random-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                        <circle cx="8" cy="8" r="1.5"/>
                        <circle cx="16" cy="16" r="1.5"/>
                        <circle cx="12" cy="12" r="1.5"/>
                    </svg>
                    <span>Случайная</span>
                </a>

                <div class="nav-section-label">Категории</div>
                <a href="#category/Знаменитости" class="nav-link" data-nav="category/Знаменитости">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Люди и биографии</span>
                </a>
                <a href="#category/Страны" class="nav-link" data-nav="category/Страны">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                        <path d="M2 12h20" />
                    </svg>
                    <span>Страны и география</span>
                </a>
                <a href="#category/Технологии" class="nav-link" data-nav="category/Технологии">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
                        <rect x="9" y="9" width="6" height="6" />
                        <line x1="9" y1="1" x2="9" y2="4" />
                        <line x1="15" y1="1" x2="15" y2="4" />
                        <line x1="9" y1="20" x2="9" y2="23" />
                        <line x1="15" y1="20" x2="15" y2="23" />
                        <line x1="20" y1="9" x2="23" y2="9" />
                        <line x1="20" y1="14" x2="23" y2="14" />
                        <line x1="1" y1="9" x2="4" y2="9" />
                        <line x1="1" y1="14" x2="4" y2="14" />
                    </svg>
                    <span>Технологии и IT</span>
                </a>
                <a href="#category/Наука" class="nav-link" data-nav="category/Наука">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 2v7.31" />
                        <path d="M14 9.3V1.99" />
                        <path d="M8.5 2h7" />
                        <path d="M14 9.3a6.5 6.5 0 1 1-4 0" />
                        <path d="M5.52 16h12.96" />
                    </svg>
                    <span>Наука и космос</span>
                </a>
                <a href="#category/История" class="nav-link" data-nav="category/История">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                    </svg>
                    <span>История и эпохи</span>
                </a>
                <a href="#category/Видеоигры" class="nav-link" data-nav="category/Видеоигры">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2" />
                        <path d="M6 12h4" />
                        <path d="M8 10v4" />
                        <path d="M15 13h.01" />
                        <path d="M18 11h.01" />
                    </svg>
                    <span>Видеоигры</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#viger" class="dev-badge-link" title="О разработчике">
                    <div class="dev-avatar-sm">V</div>
                    <div class="dev-info">
                        <span class="dev-name">VIGER Dev</span>
                        <span class="dev-tag">Developer Portal</span>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Sidebar Backdrop for Mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Top App Header -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn menu-btn" id="mobile-menu-btn" aria-label="Открыть меню навигации">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>

                    <!-- Search Container with Live Suggestions -->
                    <div class="search-container" id="search-container">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <form id="search-form" class="search-form" autocomplete="off" onsubmit="return false;">
                            <input type="text" id="searchInput" class="search-input" placeholder="Поиск в Википедии (нажмите Enter)..." aria-label="Поиск по статьям" autocomplete="off">
                            <button type="button" id="search-clear-btn" class="search-clear-btn hidden" aria-label="Очистить поиск">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </form>

                        <!-- Autocomplete Suggestions Dropdown -->
                        <div class="search-suggestions-dropdown hidden" id="search-suggestions">
                            <div class="suggestions-header" id="suggestions-header">Подсказки</div>
                            <ul class="suggestions-list" id="suggestions-list" role="listbox"></ul>
                        </div>
                    </div>
                </div>

                <div class="topbar-actions">
                    <!-- Native Wikipedia Language Switcher -->
                    <div class="lang-selector-wrapper">
                        <svg class="lang-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="2" y1="12" x2="22" y2="12"/>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                        <select id="lang-select" class="lang-select" aria-label="Выбор языка Википедии">
                            <option value="ru" selected>RU (Русский)</option>
                            <option value="en">EN (English)</option>
                            <option value="uz">UZ (Oʻzbekcha)</option>
                            <option value="de">DE (Deutsch)</option>
                            <option value="es">ES (Español)</option>
                            <option value="fr">FR (Français)</option>
                        </select>
                    </div>

                    <!-- Theme Switcher -->
                    <button class="icon-btn theme-toggle-btn" id="theme-toggle-btn" aria-label="Переключить тему оформления" title="Сменить тему">
                        <!-- Icon swapped via JS -->
                        <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Viewport -->
            <div class="content-scroll" id="app-content" tabindex="-1">
                <!-- Injected via Router in app.js -->
            </div>
        </main>
    </div>

    <!-- Notification Toast System -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Main Application Logic -->
    <script src="app.js"></script>
</body>

</html>
